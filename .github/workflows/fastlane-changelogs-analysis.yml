name: Changelogs Analysis

on:
    push:
        branches:
            - main
        paths:
            - metadata/**/changelogs
    pull_request_target:
        types:
            - opened
            - edited
        paths:
            - metadata/**/changelogs
    workflow_dispatch:

jobs:
    i18n-summary:
        runs-on: ubuntu-latest
        if: github.event_name != 'pull_request_target' || github.event.pull_request.draft == false

        steps:
            - uses: actions/checkout@v4

            - name: 🚨 Analyze changelogs
              run: ./gradlew -q changelogLimit
