name: Stable

on:
    workflow_dispatch:

env:
    SIGNING_KEYSTORE_FILE: ./secrets/signing_key.jks
    OUTPUT_DIR: ./dist

permissions:
    contents: write

jobs:
    release-build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive

                  cache: npm

            - uses: actions/setup-java@v4
              with:
                  distribution: zulu
                  java-version: 25
                  cache: gradle

            - name: ☕ Cache provisioned JDKs
              uses: actions/cache@v4
              with:
                  path: ~/.gradle/jdks
                  key: gradle-jdks-${{ runner.os }}-${{ hashFiles('gradle/gradle-daemon-jvm.properties') }}
                  restore-keys: |
                      gradle-jdks-${{ runner.os }}-


            - name: 🔢 Get version
              id: app_version
              run: |
                  chmod +x ./gradlew
                  echo "version=$(./gradlew -q versionPrint)" >> $GITHUB_OUTPUT

            - name: 🔎 Check for release
              run: |
                  chmod +x ./gradlew
                  ./gradlew -q tagExists -Ptag=$TAG_NAME
              env:
                  TAG_NAME: v${{ steps.app_version.outputs.version }}

            - name: 🔨 Generate certificate
              run: |
                  mkdir -p $(dirname $SIGNING_KEYSTORE_FILE)
                  echo $SIGNING_KEYSTORE_FILE_CONTENT | base64 -di > $SIGNING_KEYSTORE_FILE
              env:
                  SIGNING_KEYSTORE_FILE_CONTENT: ${{ secrets.SIGNING_KEYSTORE_FILE }}

            - name: 🔨 Build assets
              run: |
                  chmod +x ./gradlew
                  ./gradlew assembleRelease
                  ./gradlew bundleRelease
                  ./gradlew moveOutputs
              env:
                  APP_VERSION_NAME: ${{ steps.app_version.outputs.version }}
                  SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
                  SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
                  SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

            - name: 🚀 Upload assets
              uses: ncipollo/release-action@v1
              with:
                  tag: v${{ steps.app_version.outputs.version }}
                  artifacts: ${{ env.OUTPUT_DIR }}/*
                  generateReleaseNotes: true
                  draft: true
                  artifactErrorsFailBuild: true
